name: CI (macOS)

on:
  push:
    branches: [main, master, codex/tauri-macos]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    # macOS is the sole supported platform (Tauri 2, Apple Silicon).
    # Order matters: the frontend bundle is embedded into the Rust build
    # (custom protocol), so frontend install/test/build runs FIRST.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Frontend install (frozen lockfile)
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Frontend typecheck
        working-directory: frontend
        run: bun run typecheck

      - name: Frontend tests
        working-directory: frontend
        run: bun run test

      - name: Frontend build (embedded assets)
        working-directory: frontend
        run: bun run build

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      # Test isolation: AICOUNCIL_DATA_DIR keeps every test away from any real
      # user data; tests additionally use temp dirs internally.
      - name: Rust tests (isolated data dir)
        env:
          AICOUNCIL_DATA_DIR: ${{ runner.temp }}/aicouncil-ci-data
        run: cargo test --locked

      - name: Release build + .app bundle (ad-hoc signed, via @tauri-apps/cli)
        run: |
          mkdir -p dist
          bunx --bun @tauri-apps/cli@^2 build --bundles app

      - name: Stage artifacts (exe + .app) with hashes
        run: |
          APP="$(ls -d target/release/bundle/macos/*.app | head -n1)"
          cp -R "$APP" dist/
          cp target/release/aicouncil dist/aicouncil
          shasum -a 256 dist/aicouncil | tee dist/aicouncil.sha256
          shasum -a 256 "$APP" | tee "dist/$(basename "$APP").sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: aicouncil-macos
          if-no-files-found: error
          path: |
            dist/*.app
            dist/*.app.sha256
            dist/aicouncil
            dist/aicouncil.sha256
