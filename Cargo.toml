[package]
name = "aicouncil"
version = "0.2.3"
edition = "2021"
rust-version = "1.88"
description = "AiCouncil - minimal native AI chat with parallel model branches"
license = "MIT"

[lib]
name = "aicouncil"
path = "src/lib.rs"

[[bin]]
name = "aicouncil"
path = "src/main.rs"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
# Tauri 2 桌面壳(macOS 唯一支持平台)
tauri = { version = "2", features = [] }
# 原生保存对话框(导出 Markdown:先落盘再报成功)
tauri-plugin-dialog = "2"

# 异步与网络
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "gzip", "system-proxy"] }
futures-util = "0.3"

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 存储
rusqlite = { version = "0.32", features = ["bundled", "backup"] }

# 平台
directories = "5"

# 领域
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde"] }
thiserror = "2"

# .env 命名变量解析(仅取 OPENROUTER_API_KEY / DEEPSEEK_API_KEY,不导入全局)
dotenvy = "0.15"

# 异步流构造
async-stream = "0.3"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
