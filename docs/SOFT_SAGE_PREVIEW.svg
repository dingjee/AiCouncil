<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
  <title>AiCouncil — Soft Sage color study</title>
  <desc>Proposed warm neutral reading palette. A design study, not a screenshot of the implemented application.</desc>
  <rect width="1200" height="820" fill="#F4F3EE"/>
  <g font-family="Segoe UI, Arial, sans-serif" fill="#2E342F">
    <text x="36" y="40" font-size="23" font-weight="600">Soft Sage</text>
    <text x="36" y="65" font-size="13" fill="#626B62">AiCouncil / whole-app reading palette / design study</text>
    <rect x="36" y="88" width="1128" height="602" rx="6" fill="#FAF9F5" stroke="#D6DBD2"/>
    <path d="M918 88h240a6 6 0 0 1 6 6v590a6 6 0 0 1-6 6H918Z" fill="#ECEDE7"/>
    <path d="M918 88v602M36 142h882" stroke="#D6DBD2"/>
    <text x="58" y="121" font-size="16" font-weight="600">Reading notes</text>
    <g fill="none" stroke="#536451" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="m198 117 2-7 9-9 5 5-9 9-7 2m9-14 5 5"/>
      <path d="M841 105v16m-5-5 5 5 5-5M832 122v4h18v-4"/>
      <rect x="875" y="104" width="22" height="20" rx="3"/><path d="M889 104v20"/>
      <path d="M947 107a10 10 0 1 1-2 12m-1-12v7h7m5-6v6l4 3"/>
      <path d="m1001 106 10-5 10 5-10 5-10-5Zm0 7 10 5 10-5m-20 7 10 5 10-5"/>
      <circle cx="1070" cy="114" r="8"/><circle cx="1070" cy="114" r="3"/>
    </g>
    <rect x="58" y="161" width="836" height="71" rx="6" fill="#EAEFE7" stroke="#D6DBD2"/>
    <text x="74" y="181" font-size="11" fill="#626B62">You</text>
    <text x="74" y="207" font-size="15">What makes a long answer comfortable to read?</text>
    <text x="74" y="260" font-size="11" fill="#626B62">Assistant</text>
    <g fill="none" stroke="#536451" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="847" y="247" width="12" height="13" rx="2"/><path d="M844 257h-3v-15h12v3"/>
      <path d="M877 247a7 7 0 1 1-4 10m-1-10v6h6"/>
    </g>
    <text x="74" y="307" font-size="39" font-weight="650">Room to read</text>
    <text x="74" y="342" font-size="15">Warm surfaces keep the page calm. Deep ink keeps the words clear.</text>
    <rect x="74" y="356" width="264" height="25" rx="2" fill="#C8DCCB"/>
    <text x="77" y="374" font-size="15">Select a passage. Copy plain text.</text>
    <text x="346" y="374" font-size="15">Keep the original formula when copying math.</text>
    <text x="74" y="411" font-size="24" font-weight="600">Clear structure</text>
    <rect x="74" y="430" width="798" height="102" rx="4" fill="#FAF9F5" stroke="#D6DBD2"/>
    <path d="M75 434a3 3 0 0 1 3-3h790a3 3 0 0 1 3 3v30H75Z" fill="#ECEFE8"/>
    <path d="M74 464h798M74 498h798M302 430v102M620 430v102" stroke="#D6DBD2"/>
    <text x="86" y="452" font-size="13" font-weight="600">Element</text>
    <text x="314" y="452" font-size="13" font-weight="600">Purpose</text>
    <text x="632" y="452" font-size="13" font-weight="600">Appearance</text>
    <text x="86" y="486" font-size="13">Body text</text>
    <text x="314" y="486" font-size="13">Reading and selection</text>
    <text x="632" y="486" font-size="13">Deep neutral ink</text>
    <text x="86" y="520" font-size="13">Links and actions</text>
    <text x="314" y="520" font-size="13" fill="#37687B" text-decoration="underline">Open a reference</text>
    <text x="632" y="520" font-size="13" fill="#496B55">Quiet sage emphasis</text>
    <rect x="74" y="546" width="798" height="32" rx="4" fill="#ECEFE8"/>
    <text x="86" y="567" font-family="Consolas, monospace" font-size="13"><tspan fill="#37687B">let</tspan> theme = <tspan fill="#89662D">"soft_sage"</tspan>; <tspan fill="#606C5E">// readable code, gentle surface</tspan></text>
    <path d="M36 595h882" stroke="#D6DBD2"/>
    <rect x="58" y="608" width="836" height="42" rx="4" fill="#F8F8F2" stroke="#768B74"/>
    <text x="72" y="634" font-size="14" fill="#626B62">Ask a follow-up…</text>
    <text x="66" y="673" font-size="12" fill="#496B55">Current model +1  ⌄</text>
    <text x="238" y="673" font-size="12" fill="#626B62">Parallel</text>
    <rect x="860" y="657" width="32" height="25" rx="4" fill="#496B55"/>
    <path d="m869 669 15-6-5 13-3-5-7-2 7 2 8-8" fill="none" stroke="#FAF9F5" stroke-width="1.4" stroke-linejoin="round"/>
    <text x="938" y="162" font-size="11" fill="#626B62">TODAY</text>
    <rect x="930" y="175" width="222" height="38" rx="4" fill="#DCE7DB"/>
    <text x="942" y="199" font-size="14" font-weight="600">Reading notes</text>
    <text x="942" y="240" font-size="14">A small design question</text>
    <text x="942" y="278" font-size="14">Comparing two ideas</text>
    <text x="938" y="329" font-size="11" fill="#626B62">YESTERDAY</text>
    <text x="942" y="365" font-size="14">A useful conversation</text>
    <path d="M934 627h214" stroke="#D6DBD2"/>
    <text x="942" y="651" font-size="12" fill="#626B62">Soft Sage · English</text>
    <text x="942" y="674" font-size="11" fill="#626B62">Body 12.09:1 · secondary 4.69:1</text>
    <g font-size="11" fill="#626B62">
      <rect x="36" y="717" width="128" height="34" rx="4" fill="#F4F3EE" stroke="#D6DBD2"/><text x="36" y="770">Canvas #F4F3EE</text>
      <rect x="181" y="717" width="128" height="34" rx="4" fill="#FAF9F5" stroke="#D6DBD2"/><text x="181" y="770">Surface #FAF9F5</text>
      <rect x="326" y="717" width="128" height="34" rx="4" fill="#ECEDE7"/><text x="326" y="770">Sidebar #ECEDE7</text>
      <rect x="471" y="717" width="128" height="34" rx="4" fill="#2E342F"/><text x="471" y="770">Ink #2E342F</text>
      <rect x="616" y="717" width="128" height="34" rx="4" fill="#496B55"/><text x="616" y="770">Accent #496B55</text>
      <rect x="761" y="717" width="128" height="34" rx="4" fill="#C8DCCB"/><text x="761" y="770">Selection #C8DCCB</text>
      <rect x="906" y="717" width="128" height="34" rx="4" fill="#37687B"/><text x="906" y="770">Link #37687B</text>
    </g>
    <text x="36" y="802" font-size="11" fill="#626B62">Color direction only. Native controls, typography, selection, streaming and DPI behavior require implementation and testing.</text>
  </g>
